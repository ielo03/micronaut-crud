name: Micronaut CI/CD

on:
  push:
    branches: ["jdbc", "main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set Up Database for Tests
        run: |
          sudo systemctl start mysql
          mysql -e "CREATE DATABASE testdb;" -uroot -proot

      - name: Grant Gradlew Execute Permission
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

      - name: Build JAR
        run: ./gradlew build

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-app
          path: build/libs/*.jar

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: micronaut-app
          path: build/libs/
